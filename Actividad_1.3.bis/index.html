<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
<main>
 
  <div class="card">
    <img id="article-illustration" src="./assets/images/illustration-article.svg" alt="Ilustration">
    <h2>Learning</h2>

 <h3>Published 21 Dec 2023</h3>

  <h1>HTML & CSS foundations</h1>
  
  <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>
  <div class="author">
<img src="./assets/images/image-avatar.webp" alt="Profile image of Greg Hopper">
  <p><strong>Greg Hooper</strong></p>

  </div>
 
  </div>

</main>

<style>
  h2{
    background-color: rgb(237, 203, 82);
    display: inline-block;
    align-self: flex-start;
    margin-bottom: 0;
    border-radius: 5px;
  }
   html{
    background-color: rgb(237, 203, 82);
   }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 20px;
    background-color: white;
    border-radius: 15px;
    width: 350px;
    border-right: 10px solid black;
    border-bottom: 7px solid black;
    border-left: 3px solid black;
    border-top: 3px solid black;

  }
  main{
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    width: 100%;
  }
  h1:hover{
    color: rgb(237, 203, 82);
  }
  #article-illustration{
    width: 100%;
    height: auto;
    border-radius: 10px;
  }
  html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  }
  h3{
    align-self: flex-start;
    font-size: 0.8rem;
    margin-bottom: 0;
  }
  h1{
    align-self: flex-start;
    margin-bottom: 0;
    font-size: 1.5rem;
  }
  .author{
    display: flex;
    align-items: center;
    gap: 10px;
    align-self: flex-start;
  }
  .author img{
    width: 40px;
    height: 40px;
    border-radius: 50%;
  }
  .author p{
    margin: 0;
  }
  .card > p{
    margin-bottom: 20px;
    color: gray;
  }
</style>
 
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Alba Romero</a>.
  </footer>
</body>
</html>
