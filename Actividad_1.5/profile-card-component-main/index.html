<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap"
  rel="stylesheet"
>

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Profile card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main class="card">
    <div class="card-header"></div>
    <img class="profile-image" src="./images/image-victor.jpg" alt="Victor Crest">
    <section class="profile-info">
      <div class="name">
        <h1>Victor Crest</h1>
        <span>26</span>
      </div>
      <p>London</p>
    </section>
  <section class="stats">
    <div class="stat">
      <strong>80K</strong>
      <span>Followers</span>
    </div>

    <div class="stat">
      <strong>803K</strong>
      <span>Likes</span>
    </div>
    <div class="stat">
      <strong>1.4K</strong>
      <span>Photos</span>
    </div>
  </section>
  </main>
</body>
<style>
  *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body{
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: hsl(185, 75%, 39%);
    background-image: url("./images/bg-pattern-top.svg"), url("./images/bg-pattern-bottom.svg");
    background-repeat: no-repeat;
    background-position: right 50vw bottom 50vh, left 50vw top 50vh;
    font-family: "Kumbh Sans", sans-serif;
  }
  .card{
    width: 350px;
    background-color: #fff;
    border-radius: 15px;
    overflow: hidden;
    position: relative;
  }
  .stats{
    display: flex;
    margin-top: 30px;
    padding: 25px 0;
    border-top: 1px solid #e0e0e0;
  
  }
  .stat{
    flex: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
  }
  .name{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
  }
  .card-header{
    width: 100%;
    height: 140px;
    background-image: url("./images/bg-pattern-card.svg");
    background-size: cover;
    background-position: center;
  }
  .profile-image{
    position: absolute;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 5px solid white;
    left: 125px;
    top: 90px;
  }
  .profile-info{
    padding-top: 60px;
    text-align: center;
  }
  .name h1{
    font-size: 18px;
    font-weight: 700;
  }
  .name span{
    color: hsl(227, 10%, 46%);
  }
  .profile-info > p{
    margin-top: 8px;
    color: #6b7082
  }
  .stat strong{
    font-size: 18px;
  }
  .stat span{
    font-size: 10px;
    letter-spacing: 2px;
    color: #6b6b6b;
  }
  .profile-info > p{
    margin-top: 8px;
    color: hsl(227, 10%, 46%);
  }
</style>
</html>
