<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <link rel="stylesheet" href="styles.css">


</head>
<body>

  <main id="tarjeta-principal">

    <div class="contenedor-imagen">
    <img src="./images/image-product-desktop.jpg">
    </div>

    <div class="contenido">
  <h3 class="categoria">Perfume</h3>

  <h1>Gabrielle Essence Eau De Parfum</h1>

  <p class="descripcion">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
  Perfumer-Creator for the House of CHANEL.</p>

  <div class="precios">
  <span id="oferta">$149.99</h1>
  <span class="precio-anterior">$169.99</p>
  </div>

  <button type="button">
    <span aria-hidden="true"><img src="./images/icon-cart.svg"></span>
    Add to Cart</button>
</div>
  </main>

</body>
</html>
