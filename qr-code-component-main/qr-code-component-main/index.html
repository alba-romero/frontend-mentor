<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | QR code component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <main>
      <div id="contenedor">
        <img id="qr-code" src="./images/image-qr-code.png" alt="Código QR" />

        <h1 style="color: black; font-size: 18px; margin-top: 20px; margin-bottom: 10px;">
          Improve your front-end skills by building projects
          </h1>

        <p style="color: gray; font-size: 14px; line-height: 1.5; margin-top: 0; margin-bottom: 20px;">
          Scan the QR code to visit Frontend Mentor and take your coding skills
          to the next level
        </p>
      </div>
      <style>
        #qr-code {
          width: 100%;
          border-radius: 10px;
        }
        body {
          background-color: hsl(212, 45%, 89%);
          font-family: "Outfit", sans-serif;
          display: flex;
          flex-direction: column;
          min-height: 100vh;
          margin: 0;
        }
        #contenedor {
          background-color: white;
          border-radius: 20px;
          padding: 16px;
          width: 300px;
          box-sizing: border-box;
          text-align: center;
        }

        main {
          display: flex;
          justify-content: center;
          align-items: center;
          flex: 1;
        }
      </style>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Alba Romero</a>.
    </footer>
  </body>
</html>
