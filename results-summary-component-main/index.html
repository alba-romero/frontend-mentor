<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | Results summary component</title>

</head>
<body>
  <main class="tarjeta-resultados">
   <section id="resultados">
<h2>Your Result</h2>
<div class="circulo">
<span class="puntuacion">76</span>
<span class="sobre">of 100</span>
</div>
<h1>Great</h1>
<p class="descripcion">You scored higher than 65% of the people
  who have taken these tests.
</p>
</section>

<section id="sumario">
  <h2>Summary</h2>
  <div class="estadisticas reaccion">
  <div class="categoria">
    <img src="./assets/images/icon-reaction.svg">
    <span>Reaction</span>
  </div>
  <p><strong>80</strong><span class="total">/ 100</span></p>
  </div>
  <div class="estadisticas memoria">
    <div class="categoria">
      <img src="./assets/images/icon-memory.svg">
      <span>Memory</span>
    </div>
    <p><strong>92</strong><span class="total">/ 100</span></p>
  </div>
  <div class="estadisticas verbal">
    <div class="categoria">
      <img src="./assets/images/icon-verbal.svg">
      <span>Verbal</span>
    </div>
    <p><strong>61</strong><span class="total">/ 100</span></p>
  </div>
  <div class="estadisticas visual">
    <div class="categoria">
      <img src="./assets/images/icon-visual.svg">
      <span>Visual</span>
    </div>
    <p><strong>73</strong><span class="total">/ 100</span></p>
  </div>
  <button type="button">Continue</button>
</section>

  </main>

</body>
</html>
